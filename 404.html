<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <title>Ariel E. Orellana — Full Stack Developer</title>
    <meta name="robots" content="noindex">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!--
      GitHub Pages sirve 404.html para rutas inexistentes. Este script convierte
      /PortfolioArielOrellana/ruta en /PortfolioArielOrellana/?/ruta (patrón
      spa-github-pages) y index.html lo decodifica antes de arrancar Vue Router,
      permitiendo URLs limpias tipo /experiencia con historial HTML5.
    -->
    <script>
      var pathSegmentsToKeep = 1
      var l = window.location
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') +
          '/?/' +
          l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash,
      )
    </script>
  </head>
  <body></body>
</html>
